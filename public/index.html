<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f4ec" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="description" content="英语精读、词库与每日小卷。数据存在本机。" />
  <title>词智 WordWise</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span>词</span></div>
        <div class="brand-text"><strong>词智</strong><small>WordWise</small></div>
      </div>
      <nav class="side-nav" id="sideNav"></nav>
      <div class="side-user" id="sideUser"></div>
      <div class="sidebar-foot">
        <div class="sync-pill" id="syncPill"><i></i><span>本地就绪</span></div>
      </div>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="菜单"></button>
          <div class="page-title">
            <h1 id="pageTitle">今天</h1>
            <p id="pageSubtitle">学习记录与接下来要做的事</p>
          </div>
        </div>
        <div class="topbar-right">
          <div class="streak-chip" id="streakChip" title="连续学习天数"></div>
          <button class="icon-btn" id="bellBtn" type="button" aria-label="提醒设置"></button>
        </div>
      </header>

      <main class="view" id="view"></main>
    </div>

    <nav class="tabbar" id="tabbar"></nav>
  </div>

  <div id="toastRoot" class="toast-root" aria-live="polite"></div>
  <div id="modalRoot"></div>
  <input type="file" id="globalFileInput" hidden />

  <script>
    // 兜底：模块脚本解析失败（如旧版 iOS Safari 不支持某些语法）时避免整页空白
    function showBootError(detail) {
      var v = document.getElementById('view');
      if (!v || v.children.length) return;
      v.innerHTML = '<div class="card"><h2>页面没能加载</h2>' +
        '<p class="small muted">请把 iOS / Safari 更新到最新版本后重试，或换用 Chrome / Edge 打开。' +
        '如果仍然空白，请把下面这行信息截图发给我们。</p>' +
        '<p class="small" style="color:var(--danger);word-break:break-all">' + String(detail || '脚本未执行') + '</p></div>';
    }
    window.addEventListener('error', function (e) {
      if (!window.__wwBooted) showBootError(e && (e.message || e.error));
    }, true);
    setTimeout(function () {
      if (!window.__wwBooted) showBootError('加载超时');
    }, 10000);
  </script>
  <noscript><p style="padding:24px">需要开启 JavaScript 才能使用词智。</p></noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
